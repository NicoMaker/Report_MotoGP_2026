          <path

          <svg class="f1fb" viewBox="0 0 64 64" aria-hidden="true">

            <path d="M0 46h64v4H0z" fill="#fff" opacity=".9" />

    <script src="js/fx.js?v=16"></script>
    <script>
      // Logo MotoGP (header, intro, favicon): file locale img/motogp-logo.png (scaricato dal server al primo avvio),
      // altrimenti direttamente da Wikimedia. Se tutto fallisce restano gli emblemi stilizzati.
      (function () {
        var L = [
          "img/motogp-logo.png",
          "img/motogp-logo.svg",
          "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Moto_Gp_logo.svg/1280px-Moto_Gp_logo.svg.png",
        ];
        (function t(i) {
          if (i >= L.length) return;
          var m = new Image();
          m.onload = function () {
            var fav = document.getElementById("fav");
            fav.href = L[i];
            fav.type = "";
            var h = document.getElementById("f1l"),
              g = document.getElementById("il");
            h.src = L[i];
            h.hidden = false;
            g.src = L[i];
            document.getElementById("lg").classList.add("hasimg");
            var im = document.getElementById("im");
            if (im) im.classList.add("hasimg");
          };
          m.onerror = function () {
            t(i + 1);
          };
          m.src = L[i];
        })(0);
      })();
    </script>
  </body>
